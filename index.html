<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wobkot - Clean Modern</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background-color: #0b0c10;
        overflow: hidden;
      }
      
      #console {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 25px;
        font-size: 13px;
        overflow: auto;
        box-sizing: border-box;
        font-family: 'JetBrains Mono', 'Fira Code', 'Lucida Console', 'Courier New', monospace;
        background-color: #0b0c10;
        color: #66ffcc;
        line-height: 1.6;
        letter-spacing: 0.3px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      /* تخصيص شكل شريط التمرير (Scrollbar) ليكون أنيقاً ومتناسقاً */
      #console::-webkit-scrollbar {
        width: 8px;
      }
      #console::-webkit-scrollbar-track {
        background: #0b0c10;
      }
      #console::-webkit-scrollbar-thumb {
        background: #1f2833;
        border-radius: 4px;
      }
      #console::-webkit-scrollbar-thumb:hover {
        background: #45a29e;
      }
    </style>
    <script src="src/main.js" defer></script>
    <title>Wobkot</title>
  </head>
  <body>
    <pre id="console">Initializing Wobkot environment...</pre>
  </body>
</html>
